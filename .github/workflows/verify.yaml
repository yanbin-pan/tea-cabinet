# Fast feedback on every branch and pull request: backend tests, a real
# production frontend build, a manifest build, and a guard that no Anthropic
# credential ever lands in frontend code.
#
# Also exposed as `workflow_call` so the deploy pipeline reuses these exact jobs
# rather than duplicating them — nothing reaches GHCR that has not passed here.
name: Verify

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: backend
      - run: npm test
        working-directory: backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest already ships kustomize, and the upstream installer refuses
      # to overwrite it ("exists. Remove it first.") rather than skipping, which
      # fails the job. Only install when it is genuinely missing.
      - name: Ensure kustomize is available
        run: |
          set -euo pipefail
          if ! command -v kustomize >/dev/null 2>&1; then
            curl -sSfL --retry 3 \
              https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
              | bash -s -- 5.4.3 /usr/local/bin
          fi
          kustomize version

      # A manifest that does not build breaks the cluster silently: Flux reports
      # the Kustomization as failed and quietly keeps serving the old version.
      # Catching it here turns that into a red pull request instead.
      - name: kustomize build
        run: kustomize build k8s > /tmp/rendered.yaml

      - name: Assert the render is sane
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # The middleware chain is what stands between this app and the open
          # internet. Assert both links, and their order: rate limiting must come
          # first so guesses are throttled before they cost a bcrypt verification.
          grep -q 'router.middlewares: tea-cabinet-tea-rate-limit@kubernetescrd,tea-cabinet-tea-basic-auth@kubernetescrd' /tmp/rendered.yaml \
            || fail "The ingress middleware chain is missing, reordered, or renamed."

          grep -q 'kind: Middleware' /tmp/rendered.yaml \
            || fail "No Middleware objects were rendered."

          # A rate limiter keyed on anything else buckets every visitor together,
          # because behind the CDN the source address is an internal pod IP.
          grep -q 'requestHeaderName: Cf-Connecting-Ip' /tmp/rendered.yaml \
            || fail "The rate limiter must key on Cf-Connecting-Ip, not the source IP."

          # Two replicas each, as designed. Catches an accidental scale-down.
          [ "$(grep -c '^  replicas: 2$' /tmp/rendered.yaml)" = "2" ] \
            || fail "Expected exactly two Deployments at replicas: 2."

          echo "Manifests render correctly."

  secrets:
    name: No plaintext secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert the frontend holds no Anthropic key or artifact globals
        run: |
          if grep -rniE 'ANTHROPIC_API_KEY|x-api-key|sk-ant-' frontend/src frontend/*.js frontend/*.html; then
            echo "::error::Anthropic credentials must never appear in frontend code."
            exit 1
          fi
          if grep -rn 'window\.storage' frontend/src; then
            echo "::error::Claude artifact storage must not be used in the app."
            exit 1
          fi
          echo "Frontend is clean."

      # A *.sops.yaml file whose values are readable means someone committed a
      # secret in the clear — a forgotten `sops --encrypt`, or a merge resolved
      # against the decrypted side. Three independent checks, because the first
      # two prove the file went through sops and the third catches the specific
      # values that would matter if it somehow did not.
      - name: Assert every .sops.yaml is actually encrypted
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r f; do
            found=1

            grep -q 'ENC\[' "$f" \
              || { echo "::error file=$f::Not encrypted. Run: sops --encrypt --in-place $f"; exit 1; }

            # sops writes this metadata block only on a real encrypt.
            grep -q '^sops:' "$f" \
              || { echo "::error file=$f::No sops metadata block; this file was not encrypted by sops."; exit 1; }

            # Belt and braces: the plaintext forms of what this repo actually stores.
            if grep -qE '\$2[aby]\$|sk-ant-' "$f"; then
              echo "::error file=$f::A plaintext credential is visible in this file."
              exit 1
            fi

            echo "$f is encrypted."
          # `! -name '.sops.yaml'` matters: the repo-root sops *config* file also
          # ends in .sops.yaml but holds no secret and is never encrypted.
          done < <(find . -path ./node_modules -prune -o \
                        \( -name '*.sops.yaml' -o -name '*.sops.yml' \) \
                        ! -name '.sops.yaml' ! -name '.sops.yml' -print)

          [ "$found" = "1" ] || echo "No .sops.yaml files to check."

  # The gap this closes: every other job runs code from the source tree, so a
  # file that exists in git but is never COPYed into the image passes all of
  # them and then CrashLoopBackOffs in the cluster. That happened — `lib/` was
  # added without updating the Dockerfile, and 34 green tests said nothing.
  #
  # Built for the runner's own architecture, not arm64. A missing file is
  # architecture-independent, and a native build needs no emulation, so this
  # stays fast enough to run on every pull request.
  image:
    name: Images boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the backend image
        run: docker build -t tea-backend:ci ./backend

      - name: Boot it and require a healthy response
        run: |
          set -euo pipefail
          docker run -d --name tea-ci -p 8080:8080 tea-backend:ci

          for i in $(seq 30); do
            if curl -fsS http://127.0.0.1:8080/api/health > /tmp/health.json 2>/dev/null; then
              echo "Healthy after ${i}s: $(cat /tmp/health.json)"
              exit 0
            fi
            # A crash-looping container will never answer, so surface why.
            if [ "$(docker inspect -f '{{.State.Running}}' tea-ci)" != "true" ]; then
              echo "::error::The backend container exited instead of serving."
              docker logs tea-ci
              exit 1
            fi
            sleep 1
          done

          echo "::error::The backend image never answered /api/health."
          docker logs tea-ci
          exit 1

      - name: Stop the container
        if: always()
        run: docker rm -f tea-ci 2>/dev/null || true

      - name: Build the frontend image
        run: docker build -t tea-frontend:ci ./frontend

      - name: Require nginx to accept its own config
        run: docker run --rm tea-frontend:ci nginx -t
