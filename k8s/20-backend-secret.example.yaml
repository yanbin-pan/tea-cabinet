# Example only — copy to k8s/20-backend-secret.yaml (gitignored) and fill in the
# real key, or skip the file entirely and create the secret imperatively:
#
#   kubectl -n tea-cabinet create secret generic tea-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
#
# Without this secret the backend still runs; /api/scan just answers 503 and the
# UI tells you to fill the fields in by hand.
apiVersion: v1
kind: Secret
metadata:
  name: tea-secrets
  namespace: tea-cabinet
type: Opaque
stringData:
  ANTHROPIC_API_KEY: REPLACE_ME
