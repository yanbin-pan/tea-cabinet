apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tea-cabinet
  labels:
    app: backend
spec:
  replicas: 1
  # Single writer on a ReadWriteOnce volume: the old pod must release the claim
  # before the new one starts, so Recreate rather than RollingUpdate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/yanbin-pan/tea-cabinet-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /app/data
            - name: ANTHROPIC_MODEL
              value: claude-sonnet-4-6
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tea-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          volumeMounts:
            - name: tea-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tea-data
          persistentVolumeClaim:
            claimName: tea-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tea-cabinet
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
