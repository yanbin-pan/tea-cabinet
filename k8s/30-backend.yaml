apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  # RollingUpdate is safe now that the claim is ReadWriteMany: both pods mount
  # the same NFS directory, and the backend only ever replaces the whole file by
  # atomic rename, so an overlapping pod cannot produce a torn read.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Prefer one replica per node so a single node failure cannot take the API
      # down. Soft, not required: on a four-node cluster it always schedules.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
      containers:
        - name: backend
          image: ghcr.io/yanbin-pan/tea-cabinet-backend:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /app/data
            - name: ANTHROPIC_MODEL
              value: claude-sonnet-4-6
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tea-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          volumeMounts:
            - name: tea-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          # Restart a pod that stops answering. Without this a wedged process
          # stays in the Service endpoints forever if it never fails readiness.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Always set a memory limit. On a small cluster one unbounded
              # app can evict everything else.
              memory: 256Mi
      volumes:
        - name: tea-data
          persistentVolumeClaim:
            claimName: tea-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
