# No TLS block and no cert-manager annotation: TLS terminates upstream at the
# CDN edge, so this listens on plain HTTP on the internal network.
#
# `/api` is routed straight to the backend, bypassing nginx, so the API path has
# one less hop. Everything else goes to the frontend, which serves the SPA.
#
# The middleware annotation names each Middleware as <namespace>-<name>@kubernetescrd
# and applies to BOTH routers this Ingress creates — the SPA and the API are
# equally gated. Order is significant and rate limiting comes first, so a flood
# of guesses is throttled before any of them costs a bcrypt verification.
#
# Getting a middleware name wrong fails to a 404 rather than an unauthenticated
# 200 — a loud failure rather than a silent hole. The `manifests` job in CI
# asserts both names survive any edit to this file.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tea-cabinet
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: tea-cabinet-tea-rate-limit@kubernetescrd,tea-cabinet-tea-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: tea.minipi.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
