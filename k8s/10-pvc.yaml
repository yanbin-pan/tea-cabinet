# No storageClassName, so this uses the cluster's default class. Pick a class
# that is shared and backed up: the collection is the entire database, and a
# node-local class would tie it to one machine's disk with no backup.
#
# ReadWriteMany, not ReadWriteOnce: the backend runs two replicas that may be
# scheduled on different nodes, and RWO would leave the second stuck in
# ContainerCreating. A shared filesystem lets both mount the same directory.
#
# This is safe *for this app specifically* because every write is a whole-file
# atomic rename (see backend/server.js) rather than an in-place update. Do not
# copy this pattern for an app with an embedded database such as SQLite, where
# two writers over a shared mount will corrupt the file.
# The request is documentation, not enforcement: the NFS provisioner applies no
# quota and a pod sees the whole filesystem regardless. Raised to state the
# intended footprint honestly now that several people store photos here. What
# actually bounds disk use is the per-photo limit and the collection size.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tea-data
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
