apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tea-cabinet
  labels:
    app: frontend
spec:
  # Stateless nginx serving static files, so it scales freely.
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/yanbin-pan/tea-cabinet-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tea-cabinet
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
