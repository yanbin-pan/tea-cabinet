# The deployment entry point. A GitOps controller watches this directory, so
# everything listed here is reconciled into the cluster shortly after it lands
# on `main`.
#
# `20-backend-secret.example.yaml` is deliberately absent: it is a template, not
# a deployable resource.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tea-cabinet

resources:
  - 00-namespace.yaml
  - 10-pvc.yaml
  - 30-backend.yaml
  - 40-frontend.yaml
  - 50-ingress.yaml
  - 60-basic-auth.yaml
  - 70-basic-auth-secret.sops.yaml

# THESE TWO TAGS ARE WRITTEN BY CI. The deploy job in .github/workflows/ci.yaml
# rewrites both `newTag` values to the commit SHA it just built and pushes the
# change back to `main`; Flux then rolls the new images out. Pinning the SHA
# rather than tracking `:latest` is what makes a deploy reproducible and a
# rollback a plain `git revert`.
images:
  - name: ghcr.io/yanbin-pan/tea-cabinet-backend
    newTag: latest
  - name: ghcr.io/yanbin-pan/tea-cabinet-frontend
    newTag: latest
