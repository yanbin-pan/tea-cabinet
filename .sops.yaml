# Secrets in this repo are committed encrypted and decrypted at deploy time by
# the GitOps controller, which holds the matching private key.
#
# The recipient below is an age *public* key: it can encrypt, and only the holder
# of the corresponding private key can read. That is why committing these files
# is safe, and why the private key is the one thing that must never be here.
creation_rules:
  # Encrypt only data/stringData so metadata stays readable and diffs reviewable.
  - path_regex: .*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    age: age1r8ph8yhw6ulpntwa34jn9k9xj6jdkw96afrtuh5wr3pt8cj0d4vq4e286m
